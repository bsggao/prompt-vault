<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
  </head>
  <body
    style="
      margin: 0;
      background: #f3f4f8;
      font-family: Arial, sans-serif;
      color: #22293b;
      padding: 32px 16px;
    "
  >
    <div
      style="max-width: 440px; margin: auto; background: #fff; border-radius: 16px; padding: 32px"
    >
      <p style="font-size: 12px; letter-spacing: 2px; color: #6672a0">PROMPTVAULT</p>
      <h1 style="font-size: 24px">你的邮箱验证码</h1>
      <p style="line-height: 1.8">请在刚才的页面输入以下验证码，完成邮箱验证。</p>
      <p lang="en" style="color: #687086; line-height: 1.8">
        Enter this code on PromptVault to verify your email.
      </p>
      <p
        style="
          padding: 20px;
          background: #f3f4f8;
          border-radius: 8px;
          font-size: 30px;
          font-weight: bold;
          letter-spacing: 5px;
          text-align: center;
        "
      >
        {{ .Token }}
      </p>
      <p style="color: #687086; font-size: 12px; line-height: 1.8">
        请勿分享验证码。如果你没有发起此次操作，请忽略本邮件。<br /><span lang="en"
          >Do not share this code. If you did not request it, you can ignore this email.</span
        >
      </p>
    </div>
  </body>
</html>
